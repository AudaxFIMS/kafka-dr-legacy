kafka-dr:
  # ─── Base Kafka client properties (applied to ALL clients: producers, consumers, AdminClients) ──
  # SSL/SASL/timeouts configured here propagate everywhere, including health checks and probes.
  default-environment:
    spring.cloud.stream.kafka.binder:
      auto-create-topics: false
      replication-factor: 1
      configuration:
        reconnect.backoff.ms: 1000
        reconnect.backoff.max.ms: 10000
        request.timeout.ms: 5000
        default.api.timeout.ms: 10000
        socket.connection.setup.timeout.ms: 3000
        socket.connection.setup.timeout.max.ms: 5000
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
        # ── SSL example (uncomment for SSL-enabled clusters) ──
        # security.protocol: SSL
        # ssl.truststore.location: ${SSL_TRUSTSTORE_LOCATION:/certs/truststore.p12}
        # ssl.truststore.password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
        # ssl.truststore.type: PKCS12
        # ssl.keystore.location: ${SSL_KEYSTORE_LOCATION:/certs/keystore.p12}
        # ssl.keystore.password: ${SSL_KEYSTORE_PASSWORD:changeit}
        # ssl.keystore.type: PKCS12
        # ssl.key.password: ${SSL_KEY_PASSWORD:changeit}
        # ── SASL example (uncomment for SASL-enabled clusters) ──
        # security.protocol: SASL_SSL
        # sasl.mechanism: PLAIN
        # sasl.jaas.config: >-
        #   org.apache.kafka.common.security.plain.PlainLoginModule required
        #   username="${KAFKA_USERNAME:admin}"
        #   password="${KAFKA_PASSWORD:admin-secret}";

  auto-create-topics: true

  # ─── Default consumer properties (applied to all consumers, overridden by per-topic properties) ──
  default-consumer-properties:
    configuration:
      max.poll.records: 500

  # ─── Default producer properties (applied to all producers, overridden by per-topic properties) ──
  default-producer-properties:
    sync: true
    configuration:
      acks: all
      max.block.ms: 5000
      delivery.timeout.ms: 10000
      request.timeout.ms: 5000

  # ─── Clusters (each with optional per-cluster property overrides) ──
  clusters:
    primary:
      bootstrap-servers: ${KAFKA_PRIMARY_BROKERS:localhost:9092}
      priority: 1
      # Per-cluster overrides (e.g., different SSL certs per region):
      # properties:
      #   configuration:
      #     ssl.truststore.location: /certs/us-east-truststore.p12
    secondary:
      bootstrap-servers: ${KAFKA_SECONDARY_BROKERS:localhost:9094}
      priority: 2
    tertiary:
      bootstrap-servers: ${KAFKA_TERTIARY_BROKERS:localhost:9096}
      priority: 3

  consumers:
    - topic: demo-events
      group: dr-demo-group
      handler: processDemoEvent
      content-type: string

    - topic: order-events
      group: dr-demo-group
      handler: processOrder
      content-type: json

    - topic: payment-events
      group: dr-demo-group
      handler: processPayment
      content-type: native
      properties:
        configuration:
          value.deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
          specific.avro.reader: "true"

    - topic: raw-telemetry
      group: dr-demo-group
      handler: processRawData
      content-type: bytes

  producers:
    - topic: demo-events
      content-type: string

    - topic: order-events
      content-type: json

    - topic: payment-events
      content-type: native
      properties:
        configuration:
          value.serializer: io.confluent.kafka.serializers.KafkaAvroSerializer

    - topic: raw-telemetry
      content-type: bytes

  health-check:
    interval-ms: 5000
    timeout-ms: 3000
    failure-threshold: 3
    recovery-threshold: 3

  late-initializer:
    timeout-ms: 3000

  idempotency:
    ttl-seconds: 3600
    key-prefix: idempotency
